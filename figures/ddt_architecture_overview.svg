<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Falcon DDT proposed architecture: perceive, map and localise, plan, control</title>
<defs><marker id="ah000c3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000c3d"/></marker><marker id="ah374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ahb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
<rect width="760" height="632" fill="#ffffff"/>
