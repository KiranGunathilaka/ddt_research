<text x="34.0" y="522.0" font-size="11" font-weight="normal" fill="#5b6170" text-anchor="start">on the car computer: Advantech MIO-5379 · Core Ultra 7 255H · ROS 2</text>
<rect x="40" y="122" width="360" height="68" rx="8" fill="#eef2ff" stroke="#002eef" stroke-width="1.6"/>
<text x="51.0" y="143.0" font-size="13" font-weight="bold" fill="#002eef" text-anchor="start">PERCEIVE</text>
<circle cx="54.0" cy="158.0" r="2.1" fill="#002eef"/>
<text x="62.0" y="162.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Create cone point clusters from the LiDAR</text>
<circle cx="54.0" cy="174.5" r="2.1" fill="#002eef"/>
<text x="62.0" y="178.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Acquire cone colors from the camera</text>
