<text x="82.0" y="313.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">on a common frame</text>
<rect x="390" y="257" width="210" height="90" rx="8" fill="#fff3d6" stroke="#b86e00" stroke-width="1.6"/>
<text x="401.0" y="278.0" font-size="13" font-weight="bold" fill="#b86e00" text-anchor="start">LOCALISE</text>
