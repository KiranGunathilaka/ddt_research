<text x="469.0" y="31.0" font-size="13" font-weight="bold" fill="#000c3d" text-anchor="start">Xsens MTi-8</text>
<circle cx="472.0" cy="46.0" r="2.1" fill="#000c3d"/>
<text x="480.0" y="50.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">IMU + RTK GNSS, time</text>
