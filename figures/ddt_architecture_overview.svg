<text x="62.0" y="440.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Estimating the path, racing line</text>
<text x="62.0" y="456.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">through the cones</text>
<rect x="380" y="400" width="240" height="90" rx="8" fill="#eef2ff" stroke="#002eef" stroke-width="1.6"/>
<text x="391.0" y="421.0" font-size="13" font-weight="bold" fill="#002eef" text-anchor="start">CONTROL</text>
<circle cx="394.0" cy="436.0" r="2.1" fill="#002eef"/>
<text x="402.0" y="440.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Calculating optimum brake,</text>
<text x="402.0" y="456.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">steering angle, throttle for</text>
<text x="402.0" y="473.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">following the estimated path</text>
<rect x="20" y="562" width="720" height="56" rx="8" fill="#eef0f6" stroke="#000c3d" stroke-width="1.6"/>
<text x="31.0" y="583.0" font-size="13" font-weight="bold" fill="#000c3d" text-anchor="start">ADS-DV (IMechE shared car provided for the DDT entry candidates)</text>
<circle cx="34.0" cy="598.0" r="2.1" fill="#000c3d"/>
<text x="42.0" y="602.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">VCU: steering, motor, brakes</text>
<circle cx="383.0" cy="598.0" r="2.1" fill="#000c3d"/>
<text x="391.0" y="602.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">wheel speeds, steering angle</text>
