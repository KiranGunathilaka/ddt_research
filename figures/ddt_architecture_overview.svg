<text x="412.0" y="297.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Estimating car position,</text>
<text x="412.0" y="313.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">orientation in the same</text>
<text x="412.0" y="330.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">common frame/map frame</text>
<rect x="40" y="400" width="240" height="90" rx="8" fill="#eef2ff" stroke="#002eef" stroke-width="1.6"/>
<text x="51.0" y="421.0" font-size="13" font-weight="bold" fill="#002eef" text-anchor="start">PLAN</text>
