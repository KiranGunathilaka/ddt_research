<text x="52.0" y="245.0" font-size="13" font-weight="bold" fill="#b86e00" text-anchor="start">SLAM</text>
<text x="102.6" y="245.0" font-size="11" font-weight="normal" fill="#5b6170" text-anchor="start">map and localise at the same time</text>
