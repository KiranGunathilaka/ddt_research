<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="678" viewBox="0 0 1620 678" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Stage 3: the simulated stack drives the real 1:10 car over Wi-Fi DDS, with live verification</title>
<defs><marker id="ah0e7490" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ah111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ah4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ah6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="1620" height="678" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">Stage 3: the stack runs in the simulator, the real 1:10 car executes its commands</text>
<rect x="20" y="48" width="1120" height="582" rx="12" fill="#f8f9fb" stroke="#334155" stroke-opacity="0.45" stroke-width="1.4"/>
<text x="34.0" y="70.0" font-size="14" font-weight="bold" fill="#334155" text-anchor="start">SIM PC</text>
<text x="100.6" y="70.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Ubuntu, ROS 2: the full stack with the 1:10 profile</text>
<rect x="1280" y="48" width="320" height="432" rx="12" fill="#ffffff" stroke="#5b6170" stroke-opacity="0.45" stroke-width="1.4"/>
<text x="1294.0" y="70.0" font-size="14" font-weight="bold" fill="#5b6170" text-anchor="start">1:10 CAR</text>
<text x="1377.6" y="70.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Raspberry Pi 5</text>
<rect x="40" y="100" width="220" height="180" rx="8" fill="#fff1ea" stroke="#9a3412" stroke-width="1.6"/>
<text x="51.0" y="121.0" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="start">Simulator</text>
<circle cx="54.0" cy="136.0" r="2.1" fill="#9a3412"/>
<text x="62.0" y="140.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">1:10 track: cones scaled</text>
<text x="62.0" y="156.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">by the wheelbase ratio</text>
<circle cx="54.0" cy="169.0" r="2.1" fill="#9a3412"/>
<text x="62.0" y="173.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">ego placed at the</text>
<text x="62.0" y="189.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">measured pose, every</text>
<text x="62.0" y="206.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">frame (no physics)</text>
<circle cx="54.0" cy="218.5" r="2.1" fill="#9a3412"/>
<text x="62.0" y="222.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">renders lidar + camera</text>
<rect x="320" y="100" width="170" height="96" rx="8" fill="#f5f0ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="331.0" y="121.0" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="start">Vehicle</text>
<circle cx="334.0" cy="136.0" r="2.1" fill="#6d28d9"/>
<text x="342.0" y="140.0" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">sim bridge in</text>
<circle cx="334.0" cy="152.5" r="2.1" fill="#6d28d9"/>
<text x="342.0" y="156.5" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">DDS commands out</text>
<rect x="530" y="100" width="170" height="96" rx="8" fill="#ebf3fc" stroke="#0b5cad" stroke-width="1.6"/>
<text x="541.0" y="121.0" font-size="13" font-weight="bold" fill="#0b5cad" text-anchor="start">Perception</text>
<circle cx="544.0" cy="136.0" r="2.1" fill="#0b5cad"/>
<text x="552.0" y="140.0" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">on rendered</text>
<text x="552.0" y="156.5" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">lidar + camera</text>
<rect x="740" y="100" width="170" height="96" rx="8" fill="#e8f5ee" stroke="#1a7f4b" stroke-width="1.6"/>
<text x="751.0" y="121.0" font-size="13" font-weight="bold" fill="#1a7f4b" text-anchor="start">Localisation</text>
<circle cx="754.0" cy="136.0" r="2.1" fill="#1a7f4b"/>
<text x="762.0" y="140.0" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">on simulated</text>
<text x="762.0" y="156.5" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">IMU, GNSS, wheels</text>
<rect x="950" y="100" width="170" height="96" rx="8" fill="#fdf2e4" stroke="#b45309" stroke-width="1.6"/>
<text x="961.0" y="121.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">Planning + control</text>
<circle cx="964.0" cy="136.0" r="2.1" fill="#b45309"/>
<text x="972.0" y="140.0" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">pure pursuit + PID</text>
<circle cx="964.0" cy="152.5" r="2.1" fill="#b45309"/>
<text x="972.0" y="156.5" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">path + prediction</text>
<rect x="441.9" y="108" width="40.1" height="17" rx="8.5" fill="#0e7490"/>
<text x="461.9" y="120.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1:10</text>
<path d="M 490,148 L 530,148" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<path d="M 700,148 L 740,148" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<path d="M 910,148 L 950,148" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<path d="M 260,148 L 320,148" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="290.0" y="141.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">sensors</text>
<rect x="320" y="216" width="590" height="30" rx="8" fill="#eef1f5" stroke="#334155" stroke-width="1.6"/>
<text x="331.0" y="237.0" font-size="13" font-weight="bold" fill="#334155" text-anchor="start"></text>
<text x="331.0" y="236.0" font-size="12" font-weight="bold" fill="#334155" text-anchor="start">5 · System: </text>
<text x="411.2" y="236.0" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">missions on the scaled track, supervisor, logs</text>
<rect x="320" y="330" width="750" height="150" rx="8" fill="#eef1f5" stroke="#334155" stroke-width="1.6"/>
<text x="331.0" y="351.0" font-size="13" font-weight="bold" fill="#334155" text-anchor="start">Verification: live, and again on the logs</text>
<circle cx="334.0" cy="366.0" r="2.1" fill="#334155"/>
<text x="342.0" y="370.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">plan vs track: cross-track, heading and speed error of the real car against the planner's path</text>
<circle cx="334.0" cy="382.5" r="2.1" fill="#334155"/>
<text x="342.0" y="386.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">prediction vs track: the controller's pose 0.5 s ahead, against where RTK saw the car</text>
<circle cx="334.0" cy="399.0" r="2.1" fill="#334155"/>
<text x="342.0" y="403.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">shadow model: the 1:10 model, fed the same commands, reset to the measured pose every 2 s</text>
<circle cx="334.0" cy="415.5" r="2.1" fill="#334155"/>
<text x="342.0" y="419.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">replay: the logged planner inputs give the same outputs offline (nothing dropped or late)</text>
<circle cx="334.0" cy="432.0" r="2.1" fill="#334155"/>
<text x="342.0" y="436.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">latency: command stamp → received on the car → first yaw-rate response</text>
<circle cx="334.0" cy="448.5" r="2.1" fill="#334155"/>
<text x="342.0" y="452.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">pass: every error inside the spread of the same track in stage 1, 1:10 profile</text>
<path d="M 1010,196 L 1010,330" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ahb45309)"/>
<text x="1018.0" y="268.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">path,</text>
<text x="1018.0" y="283.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">prediction</text>
<rect x="1300" y="100" width="280" height="140" rx="8" fill="#f5f0ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="1311.0" y="121.0" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="start">Command receiver</text>
<circle cx="1314.0" cy="136.0" r="2.1" fill="#6d28d9"/>
<text x="1322.0" y="140.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">DDS, best effort, keep last 1</text>
<circle cx="1314.0" cy="152.5" r="2.1" fill="#6d28d9"/>
<text x="1322.0" y="156.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">clamped to the 1:10 limits</text>
<circle cx="1314.0" cy="169.0" r="2.1" fill="#6d28d9"/>
<text x="1322.0" y="173.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">watchdog: no command</text>
<text x="1322.0" y="189.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">for 100 ms → brake</text>
<circle cx="1314.0" cy="202.0" r="2.1" fill="#6d28d9"/>
<text x="1322.0" y="206.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">VESC speed, servo angle</text>
<rect x="1300" y="304" width="280" height="150" rx="8" fill="#f4f5f7" stroke="#5b6170" stroke-width="1.6"/>
<text x="1311.0" y="325.0" font-size="13" font-weight="bold" fill="#5b6170" text-anchor="start">Pose on the car</text>
<circle cx="1314.0" cy="340.0" r="2.1" fill="#5b6170"/>
<text x="1322.0" y="344.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">MTi-8 kit: RTK fix from</text>
<text x="1322.0" y="360.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">its F9P, yaw rate</text>
<circle cx="1314.0" cy="373.0" r="2.1" fill="#5b6170"/>
<text x="1322.0" y="377.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">VESC wheel speed</text>
<circle cx="1314.0" cy="389.5" r="2.1" fill="#5b6170"/>
<text x="1322.0" y="393.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">EKF → pose at 50 Hz,</text>
<text x="1322.0" y="410.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">stamped in GNSS time</text>
<rect x="1300" y="540" width="280" height="72" rx="8" fill="#f4f5f7" stroke="#5b6170" stroke-width="1.6"/>
<text x="1311.0" y="561.0" font-size="13" font-weight="bold" fill="#5b6170" text-anchor="start">RTK base: F9P on a tripod</text>
<circle cx="1314.0" cy="576.0" r="2.1" fill="#5b6170"/>
<text x="1322.0" y="580.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">RTCM 3 corrections</text>
<path d="M 1440,240 L 1440,304" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#ah111827)"/>
<text x="1448.0" y="277.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="start">the real car moves</text>
<path d="M 1440,540 L 1440,454" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah6b7280)"/>
<text x="1448.0" y="494.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">RTCM over Wi-Fi</text>
<text x="1448.0" y="509.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">(str2str on the PC)</text>
<path d="M 1120,148 L 1300,148" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#ah0e7490)"/>
<text x="1210.0" y="141.0" font-size="10.5" font-weight="normal" fill="#0e7490" text-anchor="middle">steer, speed, stamp</text>
<text x="1210.0" y="168.0" font-size="10.5" font-weight="bold" fill="#0e7490" text-anchor="middle">Wi-Fi DDS</text>
<path d="M 1300,400 L 1070,400" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#ah0e7490)"/>
<text x="1210.0" y="393.0" font-size="10.5" font-weight="bold" fill="#0e7490" text-anchor="middle">measured pose,</text>
<text x="1210.0" y="424.0" font-size="10.5" font-weight="normal" fill="#0e7490" text-anchor="middle">echoed stamp</text>
<path d="M 1110,400 L 1110,600 L 150,600 L 150,280" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#ah0e7490)"/>
<circle cx="1110" cy="400" r="3.4" fill="#0e7490"/>
<rect x="485.5" y="594.0" width="309.0" height="15" rx="3" fill="#ffffff" opacity="0.96"/>
<text x="640.0" y="604.0" font-size="11" font-weight="bold" fill="#0e7490" text-anchor="middle">measured pose → the simulator puts its car here</text>
<text x="20.0" y="660.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Wi-Fi: a dedicated 5 GHz access point; Cyclone DDS with a unicast peer list, or Zenoh. The delay is measured on every run and the same delay is added to the stage 1 reference run.</text>
</svg>
