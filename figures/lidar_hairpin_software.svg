<svg xmlns="http://www.w3.org/2000/svg" width="1348" height="210" viewBox="0 0 1348 210" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>How teams with one 120° lidar cover the inside of a tight hairpin in software</title>
<defs><marker id="ah4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="1348" height="210" fill="#ffffff"/>
<text x="20.0" y="32.0" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">One 120° lidar through a tight hairpin: the inside edge comes from the map and the planner</text>
<rect x="20" y="58" width="220" height="130" rx="8" fill="#ebf3fc" stroke="#0b5cad" stroke-width="1.6"/>
<text x="31.0" y="79.0" font-size="13" font-weight="bold" fill="#0b5cad" text-anchor="start">Lidar cones</text>
<rect x="31" y="87" width="111.8" height="17" rx="8.5" fill="#0b5cad"/>
<text x="86.9" y="99.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">every 120° team</text>
<circle cx="34.0" cy="119.0" r="2.1" fill="#0b5cad"/>
<text x="42.0" y="123.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">120° view, ~20 m range</text>
<circle cx="34.0" cy="135.5" r="2.1" fill="#0b5cad"/>
<text x="42.0" y="139.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">inside cones seen on</text>
<text x="42.0" y="156.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">the approach only</text>
<rect x="292" y="58" width="220" height="130" rx="8" fill="#e8f5ee" stroke="#1a7f4b" stroke-width="1.6"/>
<text x="303.0" y="79.0" font-size="13" font-weight="bold" fill="#1a7f4b" text-anchor="start">Cone SLAM map</text>
<rect x="303" y="87" width="33.2" height="17" rx="8.5" fill="#1a7f4b"/>
<text x="319.6" y="99.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ISC</text>
<circle cx="306.0" cy="119.0" r="2.1" fill="#1a7f4b"/>
<text x="314.0" y="123.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">keeps every cone seen</text>
<circle cx="306.0" cy="135.5" r="2.1" fill="#1a7f4b"/>
<text x="314.0" y="139.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">new cones at a corner</text>
<text x="314.0" y="156.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">exit are not a fault</text>
<rect x="564" y="58" width="220" height="130" rx="8" fill="#fdf2e4" stroke="#b45309" stroke-width="1.6"/>
<text x="575.0" y="79.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">Planner input</text>
<rect x="575" y="87" width="33.2" height="17" rx="8.5" fill="#b45309"/>
<text x="591.6" y="99.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ISC</text>
<circle cx="578.0" cy="119.0" r="2.1" fill="#b45309"/>
<text x="586.0" y="123.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">map cones, not the scan</text>
<circle cx="578.0" cy="135.5" r="2.1" fill="#b45309"/>
<text x="586.0" y="139.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">within 25 m</text>
<circle cx="578.0" cy="152.0" r="2.1" fill="#b45309"/>
<text x="586.0" y="156.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">ahead of the car: 180°</text>
<rect x="836" y="58" width="220" height="130" rx="8" fill="#fdf2e4" stroke="#b45309" stroke-width="1.6"/>
<text x="847.0" y="79.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">Edges + virtual cones</text>
<rect x="847" y="87" width="73.4" height="17" rx="8.5" fill="#b45309"/>
<text x="883.7" y="99.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">FaSTTUBe</text>
<circle cx="850.0" cy="119.0" r="2.1" fill="#b45309"/>
<text x="858.0" y="123.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">each edge sorted alone</text>
<circle cx="850.0" cy="135.5" r="2.1" fill="#b45309"/>
<text x="858.0" y="139.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">lone cone: virtual cone</text>
<text x="858.0" y="156.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">3 m across</text>
<circle cx="850.0" cy="168.5" r="2.1" fill="#b45309"/>
<text x="858.0" y="172.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">path cut at 12 m (ISC)</text>
<rect x="1108" y="58" width="220" height="130" rx="8" fill="#fdf2e4" stroke="#b45309" stroke-width="1.6"/>
<text x="1119.0" y="79.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">Speed and steering</text>
<rect x="1119" y="87" width="33.2" height="17" rx="8.5" fill="#b45309"/>
<text x="1135.6" y="99.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ISC</text>
<circle cx="1122.0" cy="119.0" r="2.1" fill="#b45309"/>
<text x="1130.0" y="123.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">lateral accel ≤ 3 m/s²</text>
<circle cx="1122.0" cy="135.5" r="2.1" fill="#b45309"/>
<text x="1130.0" y="139.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">slows for R &lt; 3 m</text>
<circle cx="1122.0" cy="152.0" r="2.1" fill="#b45309"/>
<text x="1130.0" y="156.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">look-ahead ≥ 1 m</text>
<path d="M 240,123.0 L 292,123.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="266.0" y="115.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">cones</text>
<path d="M 512,123.0 L 564,123.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="538.0" y="115.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">map</text>
<path d="M 784,123.0 L 836,123.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="810.0" y="115.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">cones</text>
<path d="M 1056,123.0 L 1108,123.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="1082.0" y="115.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">path</text>
</svg>
