<rect x="1111" y="219" width="37.9" height="17" rx="8.5" fill="#1a7f4b"/>
<text x="1130.0" y="231.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU</text>
<circle cx="1114.0" cy="251.0" r="2.1" fill="#1a7f4b"/>
<text x="1122.0" y="255.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">matched by position</text>
<circle cx="1114.0" cy="267.5" r="2.1" fill="#1a7f4b"/>
<text x="1122.0" y="271.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">colour votes added</text>
<text x="1122.0" y="288.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">to the map cone</text>
<rect x="560" y="58" width="226" height="82" rx="8" fill="#f5f0ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="571.0" y="79.0" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="start">ZED2 left image</text>
<circle cx="574.0" cy="94.0" r="2.1" fill="#6d28d9"/>
<text x="582.0" y="98.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">zed-open-capture, no CUDA</text>
<circle cx="574.0" cy="110.5" r="2.1" fill="#6d28d9"/>
<text x="582.0" y="114.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">rectified, factory calibration</text>
