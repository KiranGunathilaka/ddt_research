<path d="M 786,256.0 L 830,256.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="808.0" y="248.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">colour</text>
<path d="M 1056,256.0 L 1100,256.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
<text x="1078.0" y="248.0" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">cones</text>
<path d="M 673.0,140 L 673.0,190" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah4b5563)"/>
