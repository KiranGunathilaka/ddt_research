<circle cx="844.0" cy="259.0" r="2.1" fill="#1a7f4b"/>
<text x="852.0" y="263.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">scan time stamp</text>
<rect x="1100" y="190" width="226" height="132" rx="8" fill="#e8f5ee" stroke="#1a7f4b" stroke-width="1.6"/>
